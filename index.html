<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Streaks — Daily Goals</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg:#12151A;
    --card:#1C2028;
    --card-hi:#242833;
    --line:#2B2F3A;
    --text:#F0F1F3;
    --text-dim:#9599A6;
    --text-faint:#5B5F6B;
    --accent:#5FD98A;
    --accent-dim:#2A5B3F;
    --warn:#E8896A;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --mono: "SF Mono", ui-monospace, "Menlo", monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font); height:100%;}
  body{
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overscroll-behavior-y: contain;
  }
  #app{max-width:520px; margin:0 auto; padding:0 18px 100px;}

  /* ---- auth gate ---- */
  .auth-screen{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:20px;
  }
  .auth-screen .logo{font-size:52px; margin-bottom:10px;}
  .auth-screen h1{font-size:26px; margin:0 0 6px; letter-spacing:-0.02em;}
  .auth-screen p{color:var(--text-dim); font-size:14px; max-width:280px; line-height:1.5; margin:0 0 28px;}
  .google-btn{
    display:flex; align-items:center; gap:10px; justify-content:center;
    background:#fff; color:#1F1F1F; border:none; border-radius:14px;
    padding:14px 22px; font-size:15px; font-weight:600; font-family:var(--font);
  }
  .google-btn:active{opacity:0.85;}
  .config-warn{
    margin-top:24px; font-size:12px; color:var(--warn); max-width:300px; line-height:1.5;
  }
  .lock-btn{
    display:flex; align-items:center; gap:10px; justify-content:center;
    background:var(--accent); color:#0B1410; border:none; border-radius:14px;
    padding:14px 26px; font-size:15px; font-weight:700; font-family:var(--font);
  }
  .lock-btn:active{opacity:0.85;}

  header.top{
    position:sticky; top:0; z-index:5;
    background:linear-gradient(var(--bg) 75%, transparent);
    padding:22px 0 10px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  }
  header.top h1{font-size:28px; font-weight:700; letter-spacing:-0.02em; margin:0;}
  header.top p{margin:4px 0 0; color:var(--text-dim); font-size:14px;}
  .signout-btn{background:none; border:1px solid var(--line); color:var(--text-dim); font-size:12px; padding:7px 12px; border-radius:20px; margin-top:22px; white-space:nowrap;}
  .menu-btn{
    flex:none; width:38px; height:38px; border-radius:50%; margin-top:22px;
    background:var(--card); border:1px solid var(--line); color:var(--text-dim);
    font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .menu-btn:active{background:var(--card-hi);}
  .list-group{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:14px;}
  .list-row{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--line); font-size:14px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .label{color:var(--text);}
  .list-row .value{color:var(--text-dim); font-size:13px;}
  .list-row .chev{color:var(--text-faint); font-size:15px;}

  .empty{ text-align:center; padding:60px 20px; color:var(--text-dim); }
  .empty .big{font-size:40px; margin-bottom:6px;}
  .empty h2{color:var(--text); font-size:18px; margin:0 0 6px;}
  .empty p{font-size:14px; margin:0; line-height:1.5;}

  .goal-card{
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px;
    display:flex; gap:14px; align-items:center; cursor:pointer; transition:background 0.15s ease;
  }
  .goal-card:active{background:var(--card-hi);}
  .ring-wrap{position:relative; width:56px; height:56px; flex:none;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-wrap .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; font-weight:600; color:var(--accent);}
  .goal-info{flex:1; min-width:0;}
  .goal-info h3{margin:0 0 3px; font-size:16px; font-weight:600; letter-spacing:-0.01em;}
  .goal-info .meta{font-size:13px; color:var(--text-dim);}
  .streak-pill{font-family:var(--mono); font-size:11px; font-weight:600; background:var(--accent-dim); color:var(--accent); padding:2px 8px; border-radius:20px; white-space:nowrap;}
  .streak-pill.zero{background:#2A2D35; color:var(--text-faint);}
  .today-btn{flex:none; width:40px; height:40px; border-radius:12px; border:1.5px solid var(--line); background:transparent; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:18px;}
  .today-btn.done{background:var(--accent); border-color:var(--accent); color:#0B1410;}

  .fab{
    position:fixed; right:20px; bottom:calc(24px + env(safe-area-inset-bottom));
    width:58px; height:58px; border-radius:50%; background:var(--accent); color:#0B1410;
    border:none; font-size:28px; font-weight:400; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(95,217,138,0.35); z-index:10;
  }
  .fab:active{transform:scale(0.94);}

  .sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:flex-end; z-index:20;}
  .sheet{background:var(--card); width:100%; border-radius:22px 22px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 16px;}
  .sheet h2{margin:0 0 18px; font-size:19px; font-weight:700;}
  label.field{display:block; margin-bottom:16px;}
  label.field .lbl{font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px; display:block;}
  input[type=text], input[type=number], input[type=time]{width:100%; background:#0F1216; border:1px solid var(--line); color:var(--text); font-size:16px; padding:12px 14px; border-radius:12px; font-family:var(--font);}
  input:focus{outline:none; border-color:var(--accent);}
  .type-row{display:flex; flex-wrap:wrap; gap:8px;}
  .type-opt{flex:1 1 40%; text-align:center; padding:10px 6px; border-radius:12px; border:1px solid var(--line); font-size:12px; color:var(--text-dim);}
  .type-opt.sel{border-color:var(--accent); color:var(--accent); background:var(--accent-dim);}
  .target-row{display:flex; gap:10px; align-items:flex-end;}
  .target-row input{flex:1;}
  .target-row span{color:var(--text-dim); font-size:14px; padding-bottom:12px; white-space:nowrap;}
  .btn-primary{width:100%; padding:15px; border-radius:14px; border:none; background:var(--accent); color:#0B1410; font-size:16px; font-weight:600; margin-top:6px;}
  .btn-primary[disabled]{opacity:0.5;}
  .btn-ghost{width:100%; padding:14px; border-radius:14px; border:1px solid var(--line); background:transparent; color:var(--text-dim); font-size:14px; margin-top:10px;}
  .btn-danger-text{width:100%; text-align:center; padding:14px; color:var(--warn); font-size:14px; margin-top:4px; background:none; border:none;}

  .detail-head{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
  .back-btn{background:none; border:none; color:var(--accent); font-size:16px; font-weight:600; padding:8px 10px 8px 0; display:flex; align-items:center; gap:4px;}
  .back-btn .arrow{font-size:20px; line-height:1;}
  .edit-btn{margin-left:auto; background:none; border:1px solid var(--line); color:var(--text-dim); font-size:13px; padding:7px 14px; border-radius:20px;}
  .day-grid{display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; margin:18px 0;}
  .day-cell{aspect-ratio:1; border-radius:9px; background:#0F1216; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; color:var(--text-faint); position:relative;}
  .day-cell.done{background:var(--accent); border-color:var(--accent); color:#0B1410; font-weight:700;}
  .day-cell.partial{background:var(--accent-dim); border-color:var(--accent); color:var(--accent); font-weight:700;}
  .day-cell.miss{background:#2A1F1F; border-color:#402828; color:var(--warn);}
  .day-cell.today{border-color:var(--accent); border-width:2px; color:var(--text);}
  .day-cell.future{opacity:0.35;}
  .stat-row{display:flex; gap:10px; margin-bottom:18px;}
  .stat-box{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center;}
  .stat-box .num{font-family:var(--mono); font-size:22px; font-weight:700; color:var(--accent);}
  .stat-box .lbl{font-size:11px; color:var(--text-dim); margin-top:2px; text-transform:uppercase; letter-spacing:0.05em;}
  .hint{font-size:12px; color:var(--text-faint); line-height:1.5; margin-top:4px;}
  .finish-banner{background:var(--accent-dim); border:1px solid var(--accent); border-radius:16px; padding:18px; margin-bottom:18px; text-align:center;}
  .finish-title{font-size:18px; font-weight:700; margin-bottom:4px;}
  .toast{position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:#242833; color:var(--text); padding:10px 18px; border-radius:20px; font-size:13px; z-index:30; opacity:0; transition:opacity 0.2s ease; border:1px solid var(--line);}
  .toast.show{opacity:1;}
  .loading{display:flex; align-items:center; justify-content:center; min-height:60vh; color:var(--text-dim); font-size:14px;}

  .confirm-box{background:var(--card); width:100%; max-width:340px; border-radius:18px; padding:22px 20px; text-align:center;}
  .confirm-box p{font-size:15px; margin:0 0 18px; color:var(--text);}
  .confirm-row{display:flex; gap:10px;}
  .confirm-row button{flex:1; padding:13px; border-radius:12px; border:none; font-size:14px; font-weight:600;}
  .confirm-cancel{background:var(--card-hi); color:var(--text-dim);}
  .confirm-ok{background:var(--warn); color:#1a0e0a;}

  .num-sheet .num-title{font-size:15px; color:var(--text-dim); margin-bottom:4px;}
  .num-sheet .num-goal{font-size:13px; color:var(--text-faint); margin-bottom:18px;}
  .num-stepper{display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom:20px;}
  .num-stepper button{
    width:52px; height:52px; border-radius:50%; border:1px solid var(--line); background:var(--card-hi);
    color:var(--accent); font-size:26px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .num-stepper button:active{background:var(--accent-dim);}
  .num-stepper input{
    width:90px; text-align:center; font-size:32px; font-weight:700; font-family:var(--mono);
    background:transparent; border:none; color:var(--text); padding:0;
  }
  .num-stepper input:focus{outline:none;}
  .num-target-hint{text-align:center; font-size:12px; color:var(--text-faint); margin-bottom:18px;}

  .record-btn{flex:none; padding:0 16px; height:40px; border-radius:20px; border:1.5px solid var(--accent); background:var(--accent-dim); color:var(--accent); font-size:13px; font-weight:600; white-space:nowrap;}
  .elapsed-box{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:26px 18px; text-align:center; margin-bottom:16px;}
  .elapsed-box .big-num{font-family:var(--mono); font-size:30px; font-weight:700; color:var(--accent); letter-spacing:-0.01em;}
  .elapsed-box .sub{font-size:12px; color:var(--text-dim); margin-top:6px;}
  .record-now-btn{width:100%; padding:15px; border-radius:14px; border:none; background:var(--accent); color:#0B1410; font-size:16px; font-weight:600; margin-bottom:18px;}
  .hist-item{display:flex; justify-content:space-between; align-items:center; padding:12px 4px; border-bottom:1px solid var(--line);}
  .hist-item:last-child{border-bottom:none;}
  .hist-item .when{font-size:14px; color:var(--text);}
  .hist-item .gap{font-size:12px; color:var(--text-faint); margin-top:2px;}
  .hist-item .del{background:none; border:none; color:var(--text-faint); font-size:18px; padding:6px 8px;}
  .section-lbl{font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin:20px 0 10px;}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   FILL THESE TWO IN — from Supabase → Settings → API
   ========================================================= */
const SUPABASE_URL = "https://gsmgbefdhvsvltgkrybu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_skRBOwpCtMOh__qIe41gNA_1UlEVqHV";
/* ========================================================= */

/* =========================================================
   The EXACT URL this app is hosted at — must match what's
   registered in Supabase's Redirect URLs allowlist exactly.
   ========================================================= */
const APP_URL = "https://yinkaowolabi091-web.github.io/streaks-app/";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let session = null;
let goals = [];           // [{id, name, type, target, unit, days, start_date, reminder_time, log:{date:{met,value}}}]
let view = { screen: 'list', goalId: null };

function toast(msg, duration=1600){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=> t.classList.remove('show'), duration);
}

const STREAK_MILESTONES = [7, 14, 30, 50, 100, 200, 365];
function celebrateIfMilestone(goal, streak){
  if(STREAK_MILESTONES.includes(streak)){
    const per = goal.period === 'month' ? (streak === 1 ? 'month' : 'months') : (streak === 1 ? 'day' : 'days');
    toast(`🔥 ${streak}-${goal.period === 'month' ? 'month' : 'day'} streak on "${goal.name}"!`, 3200);
  }
}

/* ---------------- Face ID / Touch ID app lock (WebAuthn, this device only) ---------------- */
function isFaceLockEnabled(){
  return localStorage.getItem('faceLockEnabled') === 'true' && !!localStorage.getItem('faceLockCredId');
}
function bufToB64(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function b64ToBuf(b64){
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for(let i=0; i<bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}
async function enableFaceLock(){
  if(!window.PublicKeyCredential){ toast('Face ID / Touch ID isn\'t supported in this browser'); return; }
  try{
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: { name: 'Streaks' },
        user: {
          id: crypto.getRandomValues(new Uint8Array(16)),
          name: (session && session.user.email) || 'streaks-user',
          displayName: 'Streaks'
        },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000
      }
    });
    if(!cred) throw new Error('no credential');
    localStorage.setItem('faceLockCredId', bufToB64(cred.rawId));
    localStorage.setItem('faceLockEnabled', 'true');
    unlocked = true;
    toast('Face ID lock enabled');
    closeSheet();
    render();
  } catch(err){
    console.error(err);
    toast('Could not set up Face ID — cancelled or unsupported');
  }
}
function disableFaceLock(){
  localStorage.removeItem('faceLockCredId');
  localStorage.removeItem('faceLockEnabled');
  unlocked = true;
  toast('Face ID lock turned off');
  closeSheet();
  render();
}
async function attemptUnlock(){
  const credIdB64 = localStorage.getItem('faceLockCredId');
  if(!credIdB64){ unlocked = true; render(); return; }
  try{
    await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{ id: b64ToBuf(credIdB64), type: 'public-key' }],
        userVerification: 'required',
        timeout: 60000
      }
    });
    unlocked = true;
    render();
  } catch(err){
    console.error(err);
    toast('Face ID failed — tap Unlock to try again');
  }
}
function showLockSettings(){
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.id = 'sheetBackdrop';
  wrap.onclick = (e) => { if(e.target === wrap) wrap.remove(); };
  const on = isFaceLockEnabled();
  wrap.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2>App Lock</h2>
      <p class="hint" style="font-size:13px; margin-bottom:18px;">
        ${on
          ? 'Face ID / Touch ID is required every time you open Streaks on this device.'
          : 'Turn this on to require Face ID / Touch ID every time you open Streaks on this device. This only applies to this device — set it up separately on any other device.'}
      </p>
      ${on
        ? `<button class="btn-danger-text" style="border:1px solid var(--line); color:var(--warn);" onclick="disableFaceLock()">Turn off Face ID lock</button>`
        : `<button class="btn-primary" onclick="enableFaceLock()">Turn on Face ID lock</button>`}
      <button class="btn-ghost" onclick="closeSheet()">Cancel</button>
    </div>
  `;
  document.body.appendChild(wrap);
}

function showHelp(){
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.onclick = (e) => { if(e.target === wrap) wrap.remove(); };
  wrap.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2>How each goal type works</h2>

      <div style="margin-bottom:18px;">
        <div style="font-weight:700; color:var(--accent); margin-bottom:4px;">✓ Yes / No</div>
        <p class="hint" style="font-size:13px; margin:0;">
          For habits where you either did it or you didn't — nothing to count.
          Each day you tap once to mark it done. Miss a day and your streak resets.<br>
          <b>Example:</b> "No junk food" — tap the ring each day you stayed away from junk food.
        </p>
      </div>

      <div style="margin-bottom:18px;">
        <div style="font-weight:700; color:var(--accent); margin-bottom:4px;">🔢 Count</div>
        <p class="hint" style="font-size:13px; margin:0;">
          For goals with a daily number target. Each day you log how many you actually did.
          Logging anything above zero keeps your streak alive — hitting the full target just gets you a brighter mark on that day.<br>
          <b>Example:</b> "Apply to 10 jobs a day" — some days you might only manage 5, and that's still logged and still counts.
        </p>
      </div>

      <div style="margin-bottom:18px;">
        <div style="font-weight:700; color:var(--accent); margin-bottom:4px;">⏱ Time</div>
        <p class="hint" style="font-size:13px; margin:0;">
          Same idea as Count, but for a daily time target in minutes instead of a number.<br>
          <b>Example:</b> "Work on my project for 2 hours a day" — you can set a reminder time, and log however many minutes you actually spent.
        </p>
      </div>

      <div style="margin-bottom:6px;">
        <div style="font-weight:700; color:var(--accent); margin-bottom:4px;">📍 Event</div>
        <p class="hint" style="font-size:13px; margin:0;">
          For things with no daily target or fixed end date — you just record it whenever it happens.
          The app shows how long it's been since the last time, keeps a full timestamped history, and works out patterns like your longest and average gap between occurrences.<br>
          <b>Example:</b> tracking a relapse, a craving, or any occasional event — record it the moment it happens, or add it later with the actual time it occurred.
        </p>
      </div>

      <button class="btn-primary" onclick="this.closest('.sheet-backdrop').remove()">Got it</button>
    </div>
  `;
  document.body.appendChild(wrap);
}

function showConfirm(message, onConfirm){
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.style.alignItems = 'center';
  wrap.onclick = (e) => { if(e.target === wrap) wrap.remove(); };
  wrap.innerHTML = `
    <div class="confirm-box">
      <p>${message}</p>
      <div class="confirm-row">
        <button class="confirm-cancel" id="confirmCancel">Cancel</button>
        <button class="confirm-ok" id="confirmOk">Delete</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#confirmCancel').onclick = () => wrap.remove();
  wrap.querySelector('#confirmOk').onclick = () => { wrap.remove(); onConfirm(); };
}

function showNumberEntry({ title, goalName, target, unitWord, existing, onSave }){
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.id = 'numSheetBackdrop';
  wrap.onclick = (e) => { if(e.target === wrap) wrap.remove(); };
  wrap.innerHTML = `
    <div class="sheet num-sheet">
      <div class="sheet-handle"></div>
      <div class="num-title">${title}</div>
      <div class="num-goal">${escapeHtml(goalName)}</div>
      <div class="num-stepper">
        <button id="numDown" type="button">−</button>
        <input type="number" id="numInput" inputmode="decimal" value="${existing !== '' && existing != null ? existing : 0}">
        <button id="numUp" type="button">+</button>
      </div>
      <div class="num-target-hint">${unitWord} · target: ${target}</div>
      <button class="btn-primary" id="numSaveBtn">Save</button>
      <button class="btn-ghost" id="numCancelBtn">Cancel</button>
    </div>`;
  document.body.appendChild(wrap);
  const input = wrap.querySelector('#numInput');
  const step = (unitWord === 'minutes') ? 5 : 1;
  wrap.querySelector('#numDown').onclick = () => { input.value = Math.max(0, (parseFloat(input.value)||0) - step); };
  wrap.querySelector('#numUp').onclick = () => { input.value = (parseFloat(input.value)||0) + step; };
  wrap.querySelector('#numCancelBtn').onclick = () => wrap.remove();
  wrap.querySelector('#numSaveBtn').onclick = () => {
    const num = parseFloat(input.value);
    if(isNaN(num)){ toast('Enter a number'); return; }
    wrap.remove();
    onSave(num);
  };
  input.focus();
}

async function loadGoals(){
  document.getElementById('app').innerHTML = '<div class="loading">Loading your goals…</div>';
  const { data: goalRows, error: gErr } = await sb.from('goals').select('*').order('created_at', { ascending: true });
  if(gErr){ toast('Failed to load goals'); console.error(gErr); render(); return; }
  const { data: logRows, error: lErr } = await sb.from('goal_logs').select('*');
  if(lErr){ console.error(lErr); }
  const { data: eventRows, error: eErr } = await sb.from('event_logs').select('*').order('occurred_at', { ascending: false });
  if(eErr){ console.error(eErr); }

  goals = goalRows.map(g => {
    const log = {};
    (logRows || []).filter(l => l.goal_id === g.id).forEach(l => {
      log[l.log_date] = { met: l.met, fullyMet: l.value >= g.target, value: l.value };
    });
    const events = (eventRows || []).filter(e => e.goal_id === g.id).map(e => ({ id: e.id, at: e.occurred_at }));
    return {
      id: g.id, name: g.name, type: g.type, target: g.target, unit: g.unit,
      days: g.days, start: g.start_date, reminder: g.reminder_time,
      period: g.period || 'day', reminderDayOfMonth: g.reminder_day_of_month || null,
      archived: !!g.archived, log, events
    };
  });
  view = { screen: 'list', goalId: null };
  render();
}

function formatElapsed(ms){
  if(ms < 0) ms = 0;
  const mins = Math.floor(ms / 60000);
  const hrs = Math.floor(mins / 60);
  const days = Math.floor(hrs / 24);
  const months = Math.floor(days / 30);
  const remDays = days % 30;
  const remHrs = hrs % 24;
  const remMins = mins % 60;
  const parts = [];
  if(months) parts.push(`${months} month${months !== 1 ? 's' : ''}`);
  if(remDays || months) parts.push(`${remDays} day${remDays !== 1 ? 's' : ''}`);
  if(!months && remHrs) parts.push(`${remHrs} hour${remHrs !== 1 ? 's' : ''}`);
  if(!months && !days && remMins) parts.push(`${remMins} min${remMins !== 1 ? 's' : ''}`);
  if(parts.length === 0) return 'just now';
  return parts.slice(0, 2).join(', ') + ' ago';
}
function formatWhen(iso){
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function drawGoalPage(doc, g){
  doc.setFontSize(18); doc.setTextColor(0);
  doc.text(g.name, 14, 18);
  doc.setFontSize(11);
  doc.setTextColor(100);
  doc.text(typeLabel(g), 14, 26);
  doc.text(`Exported ${new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}`, 14, 32);

  if(g.type === 'event'){
    const rows = g.events.slice().reverse().map((e, i, arr) => {
      const prev = arr[i-1];
      const gap = prev ? formatElapsed(new Date(e.at) - new Date(prev.at)).replace(' ago','') : '—';
      return [formatWhen(e.at), gap];
    }).reverse();

    let summaryY = 42;
    doc.setFontSize(12); doc.setTextColor(0);
    doc.text('Summary', 14, summaryY);
    doc.setFontSize(10); doc.setTextColor(80);
    summaryY += 6;
    doc.text(`Total times recorded: ${g.events.length}`, 14, summaryY);
    if(g.events.length >= 2){
      const gaps = [];
      for(let i=0; i<g.events.length-1; i++) gaps.push(new Date(g.events[i].at) - new Date(g.events[i+1].at));
      const avg = gaps.reduce((a,b)=>a+b,0) / gaps.length;
      summaryY += 6;
      doc.text(`Average gap between: ${formatElapsed(avg).replace(' ago','')}`, 14, summaryY);
      summaryY += 6;
      doc.text(`Longest gap: ${formatElapsed(Math.max(...gaps)).replace(' ago','')}`, 14, summaryY);
    }

    doc.autoTable({
      startY: summaryY + 10,
      head: [['Recorded at', 'Gap since previous']],
      body: rows.length ? rows : [['No records yet', '']],
      styles: { fontSize: 9 },
      headStyles: { fillColor: [95, 217, 138], textColor: [10,20,15] }
    });
  } else {
    const per = g.period === 'month' ? 'Month' : 'Day';
    const entries = [];
    for(let i=0; i<g.days; i++){
      const key = periodKey(g, i);
      const label = g.period === 'month'
        ? new Date(key+'T00:00:00').toLocaleDateString(undefined,{month:'long', year:'numeric'})
        : new Date(key+'T00:00:00').toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
      const entry = g.log[key];
      let status, valueCol;
      if(!entry){ status = i <= dayIndex(g) ? 'Missed' : '—'; valueCol = ''; }
      else if(g.type === 'boolean'){ status = entry.met ? 'Done' : 'Missed'; valueCol = ''; }
      else { valueCol = String(entry.value); status = entry.fullyMet ? 'Target hit' : entry.met ? 'Logged' : 'Missed'; }
      entries.push([`${per} ${i+1} · ${label}`, valueCol, status]);
    }

    let summaryY = 42;
    doc.setFontSize(12); doc.setTextColor(0);
    doc.text('Summary', 14, summaryY);
    doc.setFontSize(10); doc.setTextColor(80);
    summaryY += 6;
    doc.text(`${per}s completed: ${completedCount(g)} / ${g.days}`, 14, summaryY);
    summaryY += 6;
    doc.text(`Current streak: ${currentStreak(g)} ${per.toLowerCase()}${currentStreak(g) !== 1 ? 's' : ''}`, 14, summaryY);
    if(g.type === 'count' || g.type === 'duration'){
      const total = Object.values(g.log).reduce((sum, v) => sum + (v.value || 0), 0);
      summaryY += 6;
      doc.text(`Total ${g.unit || (g.type === 'duration' ? 'minutes' : '')} logged: ${total}`, 14, summaryY);
    }

    doc.autoTable({
      startY: summaryY + 10,
      head: [[per, g.type === 'boolean' ? '' : (g.type === 'duration' ? 'Minutes' : (g.unit || 'Count')), 'Status']],
      body: entries,
      styles: { fontSize: 9 },
      headStyles: { fillColor: [95, 217, 138], textColor: [10,20,15] }
    });
  }
}

/* ---------------- date helpers ---------------- */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function periodKey(goal, offset){
  const start = new Date(goal.start + 'T00:00:00');
  if(goal.period === 'month'){
    const d = new Date(start.getFullYear(), start.getMonth() + offset, 1);
    return d.toISOString().slice(0,7) + '-01'; // first-of-month as the log key
  }
  const d = new Date(start);
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0,10);
}
function dateAt(startStr, offset){
  const d = new Date(startStr + 'T00:00:00');
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0,10);
}
function currentPeriodKey(goal){
  if(goal.period === 'month'){
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
  }
  return todayStr();
}
function dayIndex(goal){
  const start = new Date(goal.start + 'T00:00:00');
  if(goal.period === 'month'){
    const now = new Date();
    return (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
  }
  const now = new Date(todayStr() + 'T00:00:00');
  return Math.floor((now - start) / 86400000);
}
function completedCount(goal){ return Object.values(goal.log).filter(v => v.met).length; }
function currentStreak(goal){
  let streak = 0;
  const idx = dayIndex(goal);
  for(let i = Math.min(idx, goal.days - 1); i >= 0; i--){
    const d = periodKey(goal, i);
    if(goal.log[d] && goal.log[d].met){ streak++; } else { break; }
  }
  return streak;
}
function ring(pct, size=56, stroke=5){
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - pct);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#2B2F3A" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#5FD98A" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
  </svg>`;
}
function typeLabel(goal){
  const per = goal.period === 'month' ? 'month' : 'day';
  if(goal.type === 'count') return `${goal.target} ${goal.unit || 'x'} / ${per}`;
  if(goal.type === 'duration') return `${goal.target} min / ${per}`;
  if(goal.type === 'event') return 'Time-since tracker';
  return goal.period === 'month' ? 'Monthly check-in' : 'Daily check-in';
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderList(app){
  const activeGoals = goals.filter(g => !g.archived);
  const archivedCount = goals.length - activeGoals.length;

  // today/this-month summary (goals within their active window)
  let todayTotal = 0, todayDone = 0;
  activeGoals.forEach(g => {
    if(g.type === 'event') return;
    const idx = dayIndex(g);
    if(idx >= 0 && idx < g.days){
      todayTotal++;
      const key = currentPeriodKey(g);
      if(g.log[key] && g.log[key].met) todayDone++;
    }
  });

  let cards = activeGoals.map(g => {
    if(g.type === 'event'){
      const last = g.events[0];
      const elapsed = last ? formatElapsed(Date.now() - new Date(last.at).getTime()) : 'never recorded';
      return `
      <div class="goal-card" onclick="openDetail('${g.id}')">
        <div class="goal-info">
          <h3>${escapeHtml(g.name)}</h3>
          <div class="meta">${elapsed}</div>
        </div>
        <button class="record-btn" onclick="event.stopPropagation(); recordEventNow('${g.id}')">Record</button>
      </div>`;
    }
    const idx = dayIndex(g);
    const inWindow = idx >= 0 && idx < g.days;
    const finished = idx >= g.days;
    const key = currentPeriodKey(g);
    const done = inWindow && g.log[key] && g.log[key].met;
    const pct = Math.min(1, completedCount(g) / g.days);
    const streak = currentStreak(g);
    return `
    <div class="goal-card" onclick="openDetail('${g.id}')">
      <div class="ring-wrap">${ring(pct)}<div class="pct">${Math.round(pct*100)}%</div></div>
      <div class="goal-info">
        <h3>${escapeHtml(g.name)}</h3>
        <div class="meta">${finished ? 'Goal complete' : `${typeLabel(g)} · ${g.period === 'month' ? 'Month' : 'Day'} ${Math.min(idx+1, g.days)}/${g.days}`}</div>
      </div>
      ${finished
        ? `<span class="streak-pill">✓ done</span>`
        : `<span class="streak-pill ${streak ? '' : 'zero'}">${streak}d</span>
           <button class="today-btn ${done ? 'done' : ''}" onclick="event.stopPropagation(); quickLog('${g.id}')">${done ? '✓' : ''}</button>`}

  }).join('');

      <div class="big">◎</div>
      <h2>No goals yet</h2>
      <p>Tap + to start a 30&#8209;day streak, or track "time since last" for things like relapses or habits.</p>

  app.innerHTML = `

      <div>
        <h1>Streaks</h1>

async function quickLog(id){
  const g = goals.find(x => x.id === id);
  const d = currentPeriodKey(g);
  const idx = dayIndex(g);
  if(idx < 0 || idx >= g.days){ toast('Outside the goal window'); return; }

  if(g.type === 'boolean'){
    const cur = g.log[d];
    if(cur && cur.met){
      delete g.log[d];
      await deleteLog(g.id, d);
      toast('Unmarked');
    } else {
      g.log[d] = { met: true, value: 1 };
      await upsertLog(g.id, d, true, 1);
      const streak = currentStreak(g);
      if(STREAK_MILESTONES.includes(streak)) celebrateIfMilestone(g, streak);
      else toast(g.period === 'month' ? 'Nice — logged for this month' : 'Nice — logged for today');
    }
    render();
    return;
  }
  const unitWord = g.type === 'duration' ? 'minutes' : (g.unit || 'count');
  const existing = g.log[d] ? g.log[d].value : '';
  showNumberEntry({
    title: g.period === 'month' ? 'How many this month?' : 'How many today?', goalName: g.name, target: g.target, unitWord, existing,
    onSave: async (num) => {
      const met = num > 0;
      const fullyMet = num >= g.target;
      g.log[d] = { met, fullyMet, value: num };
      await upsertLog(g.id, d, met, num);
      render();
      const streak = currentStreak(g);
      if(met && STREAK_MILESTONES.includes(streak)) celebrateIfMilestone(g, streak);
      else toast(fullyMet ? 'Target hit — logged' : met ? `Logged ${num} — counts toward your streak` : 'Logged as not done today');
    }
  });
}

function renderOverview(app){
  const active = goals.filter(g => !g.archived);
  const idx0 = todayStr();
  const nowMonth = todayStr().slice(0,7);

  // today summary
  let todayTotal = 0, todayDone = 0;
  active.forEach(g => {
    if(g.type === 'event') return;
    const idx = dayIndex(g);
    if(idx >= 0 && idx < g.days && g.period !== 'month'){
      todayTotal++;
      if(g.log[idx0] && g.log[idx0].met) todayDone++;
    }
  });

  // this month totals for count/duration goals
  const monthRows = active.filter(g => g.type === 'count' || g.type === 'duration').map(g => {
    let total = 0;
    if(g.period === 'month'){
      const key = currentPeriodKey(g);
      total = g.log[key] ? g.log[key].value : 0;
    } else {
      Object.entries(g.log).forEach(([date, entry]) => {
        if(date.slice(0,7) === nowMonth) total += (entry.value || 0);
      });
    }
    return { name: g.name, total, unit: g.type === 'duration' ? 'min' : (g.unit || '') };
  }).filter(r => r.total > 0);

  // streak leaderboard
  const streakRows = active
    .filter(g => g.type !== 'event')
    .map(g => ({ id: g.id, name: g.name, streak: currentStreak(g), period: g.period }))
    .sort((a,b) => b.streak - a.streak);

  app.innerHTML = `
    <header class="top" style="display:block;">
      <div class="detail-head">
        <button class="back-btn" onclick="backToList()"><span class="arrow">‹</span> Back</button>
      </div>
      <h1 style="font-size:22px;">Overview</h1>
    </header>

    <div class="stat-row">
      <div class="stat-box"><div class="num">${todayTotal ? `${todayDone}/${todayTotal}` : '—'}</div><div class="lbl">Done today</div></div>
      <div class="stat-box"><div class="num">${active.filter(g=>!g.archived && g.type!=='event').length}</div><div class="lbl">Active goals</div></div>
      <div class="stat-box"><div class="num">${streakRows.length ? Math.max(...streakRows.map(r=>r.streak)) : 0}</div><div class="lbl">Best streak</div></div>
    </div>

    <div class="section-lbl">This month</div>
    ${monthRows.length ? `<div class="list-group">${monthRows.map(r => `
      <div class="list-row"><span class="label">${escapeHtml(r.name)}</span><span class="value">${r.total} ${escapeHtml(r.unit)}</span></div>
    `).join('')}</div>` : `<p class="hint">Nothing logged yet this month.</p>`}

    <div class="section-lbl">Streaks</div>
    ${streakRows.length ? `<div class="list-group">${streakRows.map(r => `
      <div class="list-row" onclick="openDetail('${r.id}')">
        <span class="label">${escapeHtml(r.name)}</span>
        <span class="value">${r.streak} ${r.period === 'month' ? 'mo' : 'd'} ›</span>
      </div>
    `).join('')}</div>` : `<p class="hint">No active goals yet.</p>`}
  `;
}

function renderDetail(app){
  const g = goals.find(x => x.id === view.goalId);
  if(!g){ backToList(); return; }
  if(g.type === 'event') return renderEventDetail(app, g);

  const idx = dayIndex(g);
  const streak = currentStreak(g);
  const done = completedCount(g);
  const periodWord = g.period === 'month' ? 'Month' : 'Day';
  const periodWordLower = g.period === 'month' ? 'month' : 'day';

  let cells = '';
  for(let i=0; i<g.days; i++){
    const d = periodKey(g, i);
    let cls = 'day-cell';
    if(i === idx) cls += ' today';
    if(i > idx) cls += ' future';
    if(g.log[d]) cls += g.log[d].met ? (g.log[d].fullyMet ? ' done' : ' partial') : ' miss';
    const showValue = (g.type === 'count' || g.type === 'duration') && g.log[d] && g.log[d].value != null;
    const cellLabel = showValue ? g.log[d].value : (i+1);
    const titleAttr = showValue ? ` title="${typeLabel(g)} — logged ${g.log[d].value}"` : '';
    cells += `<div class="${cls}"${titleAttr} onclick="${i<=idx ? `logDay('${g.id}','${d}')` : ''}">${cellLabel}</div>`;
  }

  const finished = idx >= g.days;

  // full record list for count/duration goals — every logged value, most recent first
  let logListHtml = '';
  if(g.type === 'count' || g.type === 'duration'){
    const entries = Object.entries(g.log).sort((a,b) => b[0].localeCompare(a[0]));
    if(entries.length){
      const unitWord = g.type === 'duration' ? 'min' : (g.unit || '');
      const rows = entries.map(([date, v]) => {
        const label = g.period === 'month' ? new Date(date+'T00:00:00').toLocaleDateString(undefined,{month:'long', year:'numeric'}) : new Date(date+'T00:00:00').toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
        return `<div class="hist-item">
          <div><div class="when">${label}</div><div class="gap">${v.value} ${unitWord} ${v.fullyMet ? '· target hit' : v.met ? '· logged' : '· below target'}</div></div>
        </div>`;
      }).join('');
      logListHtml = `<div class="section-lbl">Full record</div>${rows}`;
    }
  }

  app.innerHTML = `
    <header class="top" style="display:block;">
      <div class="detail-head">
        <button class="back-btn" onclick="backToList()"><span class="arrow">‹</span> Back</button>
        <button class="edit-btn" onclick="editGoal('${g.id}')">Edit</button>
      </div>
      <h1 style="font-size:22px;">${escapeHtml(g.name)}</h1>
      <p>${typeLabel(g)}</p>
    </header>

    ${finished ? `
      <div class="finish-banner">
        <div class="finish-title">🎉 Goal complete</div>
        <p class="hint" style="margin-bottom:14px;">You finished all ${g.days} ${periodWordLower}s — ${done} of them on target.</p>
        <button class="btn-primary" onclick="restartGoal('${g.id}')">Start again — new ${g.days} ${periodWordLower}s</button>
        <button class="btn-ghost" onclick="archiveGoal('${g.id}')">Archive this goal</button>
      </div>
    ` : ''}

    <div class="stat-row">
      <div class="stat-box"><div class="num">${streak}</div><div class="lbl">${periodWord} streak</div></div>
      <div class="stat-box"><div class="num">${done}/${g.days}</div><div class="lbl">Completed</div></div>
      <div class="stat-box"><div class="num">${Math.min(idx+1,g.days)}/${g.days}</div><div class="lbl">Elapsed</div></div>
    </div>

    <div class="day-grid">${cells}</div>
    <p class="hint">Tap any past or current ${periodWordLower} to log or edit it.${(g.type === 'count' || g.type === 'duration') ? ` Numbers on filled cells are what you actually logged that ${periodWordLower}.` : ''}</p>

    <div class="list-group" style="margin-top:18px;">
      <div class="list-row" onclick="editReminder('${g.id}')">
        <span class="label">Reminder</span>
        <span class="value">${g.reminder ? `${g.period === 'month' ? `Day ${g.reminderDayOfMonth || 1}, ` : ''}${g.reminder} ›` : 'Off ›'}</span>
      </div>
      <div class="list-row" onclick="exportGoal('${g.id}')">
        <span class="label">Download data (PDF)</span><span class="chev">›</span>
      </div>
      ${!finished ? `
      <div class="list-row" onclick="archiveGoal('${g.id}')">
        <span class="label">Archive this goal</span><span class="chev">›</span>
      </div>` : ''}
    </div>

    ${logListHtml}

    <button class="btn-danger-text" onclick="deleteGoal('${g.id}')">Delete goal</button>
  `;
}

function renderEventDetail(app, g){
  const last = g.events[0];
  const elapsedMs = last ? Date.now() - new Date(last.at).getTime() : null;

  let stats = '';
  if(g.events.length >= 2){
    const gaps = [];
    for(let i=0; i<g.events.length-1; i++){
      gaps.push(new Date(g.events[i].at) - new Date(g.events[i+1].at));
    }
    const avg = gaps.reduce((a,b)=>a+b,0) / gaps.length;
    const longest = Math.max(...gaps);
    stats = `
    <div class="stat-row">
      <div class="stat-box"><div class="num" style="font-size:14px;">${formatElapsed(avg).replace(' ago','')}</div><div class="lbl">Avg gap</div></div>
      <div class="stat-box"><div class="num" style="font-size:14px;">${formatElapsed(longest).replace(' ago','')}</div><div class="lbl">Longest gap</div></div>
      <div class="stat-box"><div class="num">${g.events.length}</div><div class="lbl">Total records</div></div>
    </div>`;
  }

  let history = g.events.map((e, i) => {
    const prev = g.events[i+1];
    const gap = prev ? formatElapsed(new Date(e.at) - new Date(prev.at)).replace(' ago','') + ' since previous' : 'first recorded';
    return `
    <div class="hist-item">
      <div>
        <div class="when">${formatWhen(e.at)}</div>
        <div class="gap">${gap}</div>
      </div>
      <div style="display:flex; gap:4px;">
        <button class="del" onclick="editEventEntry('${g.id}','${e.id}')" style="font-size:14px;">✎</button>
        <button class="del" onclick="deleteEventEntry('${g.id}','${e.id}')">✕</button>
      </div>
    </div>`;
  }).join('');
  if(!history) history = `<p class="hint">No records yet — tap "Record now" when it happens.</p>`;

  app.innerHTML = `
    <header class="top" style="display:block;">
      <div class="detail-head">
        <button class="back-btn" onclick="backToList()"><span class="arrow">‹</span> Back</button>
        <button class="edit-btn" onclick="editGoal('${g.id}')">Edit</button>
      </div>
      <h1 style="font-size:22px;">${escapeHtml(g.name)}</h1>
      <p>${typeLabel(g)}</p>
    </header>

    <div class="elapsed-box">
      <div class="big-num">${last ? formatElapsed(elapsedMs) : 'Never recorded'}</div>
      ${last ? `<div class="sub">last: ${formatWhen(last.at)}</div>` : ''}
    </div>

    ${stats}

    <button class="record-now-btn" onclick="recordEventNow('${g.id}')">Record now</button>
    <button class="btn-ghost" onclick="recordEventCustom('${g.id}')" style="margin-bottom:18px;">Record at a different time</button>

    <div class="section-lbl">History</div>
    ${history}

    <div class="list-group">
      <div class="list-row" onclick="exportGoal('${g.id}')">
        <span class="label">Download data (PDF)</span><span class="chev">›</span>
      </div>
      <div class="list-row" onclick="archiveGoal('${g.id}')">
        <span class="label">Archive this goal</span><span class="chev">›</span>
      </div>
    </div>
    <button class="btn-danger-text" onclick="deleteGoal('${g.id}')">Delete goal</button>
  `;
}

async function recordEventNow(gid){
  const g = goals.find(x => x.id === gid);
  const created = await insertEvent(gid, new Date().toISOString());
  if(created){
    g.events.unshift({ id: created.id, at: created.occurred_at });
    render();
    toast('Recorded');
  }
}

function recordEventCustom(gid){
  const g = goals.find(x => x.id === gid);
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.onclick = (e) => { if(e.target === wrap) wrap.remove(); };
  const nowLocal = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
  wrap.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2>Record for ${escapeHtml(g.name)}</h2>
      <label class="field"><span class="lbl">Date & time</span><input type="datetime-local" id="evTime" value="${nowLocal}"></label>
      <button class="btn-primary" id="evSaveBtn">Save</button>
      <button class="btn-ghost" id="evCancelBtn">Cancel</button>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#evCancelBtn').onclick = () => wrap.remove();
  wrap.querySelector('#evSaveBtn').onclick = async () => {
    const val = wrap.querySelector('#evTime').value;
    if(!val){ toast('Pick a time'); return; }
    const iso = new Date(val).toISOString();
    wrap.remove();
    const created = await insertEvent(gid, iso);
    if(created){
      g.events.push({ id: created.id, at: created.occurred_at });
      g.events.sort((a,b) => new Date(b.at) - new Date(a.at));
      render();
      toast('Recorded');
    }
  };
}

function editEventEntry(gid, eventId){
  const g = goals.find(x => x.id === gid);
  const entry = g.events.find(e => e.id === eventId);
  if(!entry) return;
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.onclick = (e) => { if(e.target === wrap) wrap.remove(); };
  const local = new Date(new Date(entry.at) - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
  wrap.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2>Edit record time</h2>
      <label class="field"><span class="lbl">Date & time</span><input type="datetime-local" id="evEditTime" value="${local}"></label>
      <button class="btn-primary" id="evEditSaveBtn">Save</button>
      <button class="btn-ghost" id="evEditCancelBtn">Cancel</button>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#evEditCancelBtn').onclick = () => wrap.remove();
  wrap.querySelector('#evEditSaveBtn').onclick = async () => {
    const val = wrap.querySelector('#evEditTime').value;
    if(!val){ toast('Pick a time'); return; }
    const iso = new Date(val).toISOString();
    wrap.remove();
    await updateEventRemote(eventId, iso);
    entry.at = iso;

function deleteEventEntry(gid, eventId){
  showConfirm('Delete this record?', async () => {
    await deleteEventRemote(eventId);
    const g = goals.find(x => x.id === gid);
    g.events = g.events.filter(e => e.id !== eventId);
    render();
    toast('Entry deleted');
  });
}

async function logDay(gid, d){
  const g = goals.find(x => x.id === gid);
  const isCurrent = d === currentPeriodKey(g);
  if(g.type === 'boolean'){
    if(g.log[d] && g.log[d].met){ delete g.log[d]; await deleteLog(gid, d); }
    else {
      g.log[d] = { met: true, value: 1 };
      await upsertLog(gid, d, true, 1);
      if(isCurrent){ const streak = currentStreak(g); celebrateIfMilestone(g, streak); }
    }
  } else {
    const unitWord = g.type === 'duration' ? 'minutes' : (g.unit || 'count');
    const existing = g.log[d] ? g.log[d].value : '';
    showNumberEntry({
      title: `Log for ${d}`, goalName: g.name, target: g.target, unitWord, existing,
      onSave: async (num) => {
        const met = num > 0;
        const fullyMet = num >= g.target;
        g.log[d] = { met, fullyMet, value: num };
        await upsertLog(gid, d, met, num);
        render();
        if(isCurrent && met){ const streak = currentStreak(g); celebrateIfMilestone(g, streak); }
      }
    });
    return;
  }
  render();
}

function editReminder(gid){
  const g = goals.find(x => x.id === gid);
  const isMonthly = g.period === 'month';
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.id = 'sheetBackdrop';
  wrap.onclick = (e) => { if(e.target === wrap) wrap.remove(); };
  wrap.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2>${isMonthly ? 'Monthly reminder' : 'Daily reminder'}</h2>
      ${isMonthly ? `
      <label class="field">
        <span class="lbl">Day of month</span>
        <input type="number" id="reminderDayInput" min="1" max="28" value="${g.reminderDayOfMonth || 1}">
        <p class="hint">Pick 1–28 so it works in every month.</p>
      </label>` : ''}
      <label class="field">
        <span class="lbl">Time</span>
        <input type="time" id="reminderInput" value="${g.reminder ? g.reminder.slice(0,5) : ''}">
      </label>
      <button class="btn-primary" id="reminderSaveBtn">Save</button>
      ${g.reminder ? `<button class="btn-ghost" id="reminderRemoveBtn">Remove reminder</button>` : ''}
      <button class="btn-ghost" onclick="this.closest('.sheet-backdrop').remove()">Cancel</button>
    </div>
  `;
  document.body.appendChild(wrap);
  wrap.querySelector('#reminderSaveBtn').onclick = async () => {
    const val = document.getElementById('reminderInput').value;
    if(!val){ toast('Pick a time'); return; }
    let dayOfMonth = null;
    if(isMonthly){
      dayOfMonth = parseInt(document.getElementById('reminderDayInput').value) || 1;
      dayOfMonth = Math.min(28, Math.max(1, dayOfMonth));
    }
    g.reminder = val;
    g.reminderDayOfMonth = dayOfMonth;
    await updateReminderRemote(gid, g.reminder, dayOfMonth);
    wrap.remove();
    render();
    if('Notification' in window && Notification.permission !== 'granted'){
      Notification.requestPermission();
    }
  };
  const removeBtn = wrap.querySelector('#reminderRemoveBtn');
  if(removeBtn) removeBtn.onclick = async () => {
    g.reminder = null;
    g.reminderDayOfMonth = null;
    await updateReminderRemote(gid, null, null);
    wrap.remove();
    render();
  };
}

function deleteGoal(gid){
  showConfirm('Delete this goal and its history? This can\'t be undone.', async () => {
    await deleteGoalRemote(gid);
    goals = goals.filter(x => x.id !== gid);
    backToList();
    toast('Goal deleted');
  });
}

async function archiveGoal(gid){
  const g = goals.find(x => x.id === gid);
  await setArchivedRemote(gid, true);
  g.archived = true;
  backToList();
  toast('Goal archived');
}

async function restartGoal(gid){
  const g = goals.find(x => x.id === gid);
  const created = await insertGoal({ name: g.name, type: g.type, target: g.target, unit: g.unit, days: g.days });
  if(!created) return;
  await setArchivedRemote(gid, true);
  g.archived = true;
  goals.push({ id: created.id, name: g.name, type: g.type, target: g.target, unit: g.unit, days: g.days, start: created.start_date, reminder: null, archived: false, log: {}, events: [] });
  view = { screen: 'detail', goalId: created.id };
  render();
  toast('New round started — old one archived');
}

function showArchived(){
  const archived = goals.filter(g => g.archived);
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.id = 'sheetBackdrop';
  wrap.onclick = (e) => { if(e.target === wrap) wrap.remove(); };
  const rows = archived.map(g => `
    <div class="goal-card" style="cursor:default;">
      <div class="goal-info">
        <h3>${escapeHtml(g.name)}</h3>
        <div class="meta">${typeLabel(g)}</div>
      </div>
      <button class="edit-btn" onclick="restoreGoal('${g.id}')">Restore</button>
    </div>
  `).join('') || `<p class="hint">No archived goals.</p>`;
  wrap.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2>Archived goals</h2>
      ${rows}
      <button class="btn-ghost" onclick="this.closest('.sheet-backdrop').remove()">Close</button>
    </div>
  `;
  document.body.appendChild(wrap);
}

async function restoreGoal(gid){
  const g = goals.find(x => x.id === gid);
  await setArchivedRemote(gid, false);
  g.archived = false;
  document.getElementById('sheetBackdrop')?.remove();
  render();
  toast('Goal restored');
}

/* ---------------- new / edit goal sheet ---------------- */
let draftType = 'boolean';
let draftPeriod = 'day';
let editingGoalId = null;
function openNewGoal(){
  editingGoalId = null;
  draftType = 'boolean';
  draftPeriod = 'day';
  buildSheet('New goal', 'Start goal');
  renderTargetField();
}
function editGoal(id){
  const g = goals.find(x => x.id === id);
  if(!g) return;
  editingGoalId = id;
  draftType = g.type;
  draftPeriod = g.period || 'day';
  buildSheet('Edit goal', 'Save changes');
  document.getElementById('gName').value = g.name;
  document.getElementById('gDays').value = g.days;
  document.querySelectorAll('.type-opt').forEach(el => el.classList.toggle('sel', el.dataset.t === g.type));
  document.querySelectorAll('.period-opt').forEach(el => el.classList.toggle('sel', el.dataset.p === draftPeriod));
  renderTargetField();
  if(g.type === 'count'){
    document.getElementById('gTarget').value = g.target;
    document.getElementById('gUnit').value = g.unit || '';
  } else if(g.type === 'duration'){
    document.getElementById('gTarget').value = g.target;
  }
}
function buildSheet(title, submitLabel){
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.id = 'sheetBackdrop';
  wrap.onclick = (e) => { if(e.target === wrap) closeSheet(); };
  wrap.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <h2 style="margin:0;">${title}</h2>
        <button class="edit-btn" style="margin:0;" onclick="showHelp()">What's each type?</button>
      </div>
      <label class="field" style="margin-top:16px;"><span class="lbl">Goal name</span><input type="text" id="gName" placeholder="e.g. Apply to jobs"></label>
      <label class="field">
        <span class="lbl">Type</span>
        <div class="type-row" id="typeRow">
          <div class="type-opt sel" data-t="boolean" onclick="pickType('boolean')">Yes / No</div>
          <div class="type-opt" data-t="count" onclick="pickType('count')">Count</div>
          <div class="type-opt" data-t="duration" onclick="pickType('duration')">Time</div>
          <div class="type-opt" data-t="event" onclick="pickType('event')">Event</div>
        </div>
      </label>
      <label class="field" id="periodField">
        <span class="lbl">Check in every</span>
        <div class="type-row">
          <div class="type-opt period-opt sel" data-p="day" onclick="pickPeriod('day')">Day</div>
          <div class="type-opt period-opt" data-p="month" onclick="pickPeriod('month')">Month</div>
        </div>
      </label>
      <div id="targetField"></div>
      <label class="field" id="daysField"><span class="lbl" id="daysLbl">Length (days)</span><input type="number" id="gDays" value="30" min="1" max="365"></label>
      <button class="btn-primary" onclick="createGoal()">${submitLabel}</button>
      <button class="btn-ghost" onclick="closeSheet()">Cancel</button>
    </div>
  `;
  document.body.appendChild(wrap);
}
function pickType(t){
  draftType = t;
  document.querySelectorAll('.type-opt[data-t]').forEach(el => el.classList.toggle('sel', el.dataset.t === t));
  document.getElementById('periodField').style.display = t === 'event' ? 'none' : 'block';
  renderTargetField();
}
function pickPeriod(p){
  draftPeriod = p;
  document.querySelectorAll('.period-opt').forEach(el => el.classList.toggle('sel', el.dataset.p === p));
  renderTargetField();
}
function renderTargetField(){
  const el = document.getElementById('targetField');
  const daysField = document.getElementById('daysField');
  const daysLbl = document.getElementById('daysLbl');
  daysField.style.display = draftType === 'event' ? 'none' : 'block';
  daysLbl.textContent = draftPeriod === 'month' ? 'Length (months)' : 'Length (days)';
  document.getElementById('gDays').max = draftPeriod === 'month' ? 60 : 365;

  const per = draftPeriod === 'month' ? 'month' : 'day';

  if(draftType === 'event'){
    el.innerHTML = `<p class="hint" style="margin-bottom:16px;">Open-ended — no fixed window. Tap "Record now" whenever it happens, and see how long it's been since the last time.</p>`;
    return;
  }
  if(draftType === 'boolean'){
    el.innerHTML = `<p class="hint" style="margin-bottom:16px;">You'll mark each ${per} as done or not — good for habits like "no junk food", or something you do once a month like "fast on the 1st".</p>`;
    return;
  }
  if(draftType === 'count'){
    el.innerHTML = `
      <label class="field"><span class="lbl">Target per ${per}</span><div class="target-row"><input type="number" id="gTarget" placeholder="10" min="1"><span>per ${per}</span></div></label>
      <label class="field"><span class="lbl">Unit (optional)</span><input type="text" id="gUnit" placeholder="jobs, pages, calls..."></label>`;
    return;
  }
  el.innerHTML = `<label class="field"><span class="lbl">Target per ${per}</span><div class="target-row"><input type="number" id="gTarget" placeholder="120" min="1"><span>minutes</span></div></label>`;
}
function closeSheet(){
  const el = document.getElementById('sheetBackdrop');
  if(el) el.remove();
}
async function createGoal(){
  const name = document.getElementById('gName').value.trim();
  if(!name){ toast('Give it a name'); return; }
  const days = parseInt(document.getElementById('gDays')?.value) || (draftPeriod === 'month' ? 12 : 30);
  let target = 1, unit = '';
  if(draftType !== 'boolean' && draftType !== 'event'){
    target = parseFloat(document.getElementById('gTarget').value);
    if(!target || target <= 0){ toast('Enter a target'); return; }
    if(draftType === 'count') unit = document.getElementById('gUnit').value.trim();
  }
  const period = draftType === 'event' ? 'day' : draftPeriod;
  const payload = { name, type: draftType, target, unit, days, period };

  if(editingGoalId){
    await updateGoalRemote(editingGoalId, payload);
    const g = goals.find(x => x.id === editingGoalId);
    Object.assign(g, payload);
    toast('Goal updated');
  } else {
    const created = await insertGoal(payload);
    if(created){
      goals.push({ id: created.id, name, type: draftType, target, unit, days, period, start: created.start_date, reminder: null, reminderDayOfMonth: null, log: {}, events: [] });
    }
  }
  closeSheet();
  render();
}

/* ---------------- best-effort in-app reminders ---------------- */
setInterval(() => {
  const now = new Date();
  const hhmm = now.toTimeString().slice(0,5);
  goals.forEach(g => {
    if(g.archived || g.type === 'event' || !g.reminder) return;
    if(g.reminder.slice(0,5) !== hhmm) return;
    if(g.period === 'month' && now.getDate() !== (g.reminderDayOfMonth || 1)) return;
    const key = currentPeriodKey(g);
    const already = g.log[key] && g.log[key].met;
    if(!already && 'Notification' in window && Notification.permission === 'granted'){
      new Notification('Streaks', { body: `Time for: ${g.name}` });
    }
  });
}, 30000);

init();
</script>
